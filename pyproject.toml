[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "file-organizer-agent"
version = "0.1.0"
description = "A safe AI-assisted folder organizer agent."
requires-python = ">=3.10"
dependencies = [
  "openai>=1.99.0",
]

[project.scripts]
file-organizer = "file_organizer.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
